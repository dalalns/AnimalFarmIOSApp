name: iOS Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Run unit tests on iOS Simulator
        run: |
          set -euo pipefail

          simulator_id="$(xcrun simctl list devices available -j | python3 -c '
          import json
          import sys

          devices = json.load(sys.stdin)["devices"].values()
          simulator_id = next(
              (
                  device["udid"]
                  for runtime_devices in devices
                  for device in runtime_devices
                  if device.get("isAvailable") and device["name"].startswith("iPhone")
              ),
              None,
          )
          if simulator_id is None:
              sys.exit("No available iPhone simulator was found.")
          print(simulator_id)
          ')"

          xcodebuild \
            -project FarmManager.xcodeproj \
            -scheme FarmManager \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Upload simulator app
        uses: actions/upload-artifact@v7
        with:
          name: FarmManager-iOS-Simulator
          path: build/Build/Products/Debug-iphonesimulator/FarmManager.app
          if-no-files-found: error
          retention-days: 7
