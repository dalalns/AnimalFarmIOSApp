name: iOS Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build iOS Simulator app
        run: >-
          xcodebuild
          -project FarmManager.xcodeproj
          -scheme FarmManager
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: FarmManager-iOS-Simulator
          path: build/Build/Products/Debug-iphonesimulator/FarmManager.app
          if-no-files-found: error
          retention-days: 7
